name: Engine integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  integration:
    name: engine-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine-ci-only
          POSTGRES_DB: engine
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U engine" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://engine:engine-ci-only@127.0.0.1:5432/engine
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run PostgreSQL integration and migration tests
        run: npm run build && npm run test:integration
